---
name: ci-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --cov
